<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Fighter</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; }
      #wrap { position: relative; }
      canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
      #scan { position: absolute; inset: 0; pointer-events: none;
        background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.18) 3px, rgba(0,0,0,0) 4px); }
    </style>
  </head>
  <body>
    <div id="wrap"><canvas id="screen" width="256" height="224"></canvas><div id="scan"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
