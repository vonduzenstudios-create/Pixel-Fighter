<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What's new in Pixel Fighter</title>
    <style>
      :root { --bg: #1a0610; --card: #2a1018; --edge: #c03010; --gold: #ffe060; --head: #fff4b0; --theme: #c8a070; --text: #ddd; --dim: #a09080; }
      html { background: var(--bg); }
      body {
        margin: 0; color: var(--text); font: 16px/1.5 ui-monospace, 'Courier New', monospace;
        background: linear-gradient(to bottom, #1a0610, #3a0a10) fixed;
      }
      main { max-width: 680px; margin: 0 auto; padding: 24px 16px 48px; }
      header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
      h1 { margin: 0; font-size: 28px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); text-shadow: 2px 2px 0 #000, -1px -1px 0 #000; }
      a.back { color: var(--gold); background: #5a1420; border: 2px solid #000; padding: 4px 10px; text-decoration: none; text-transform: uppercase; font-weight: bold; }
      a.back:hover { background: #7a1c2a; }
      .intro { color: var(--dim); margin: 8px 0 20px; }
      .card { background: var(--card); border: 2px solid #000; border-left: 4px solid var(--edge); padding: 12px 16px; margin: 0 0 16px; box-shadow: 4px 4px 0 #000; }
      .card h2 { margin: 0; font-size: 18px; color: var(--gold); }
      .card .theme { margin: 2px 0 8px; font-style: italic; color: var(--theme); }
      .card ul { margin: 0; padding-left: 20px; }
      .card li { margin: 6px 0; }
      .card li::marker { color: #ff4020; }
      .card li strong { color: var(--head); }
    </style>
  </head>
  <body>
    <main>
      <header>
        <a class="back" href="./index.html">&lt; Play</a>
        <h1 id="title">What's new</h1>
      </header>
      <p class="intro" id="intro"></p>
      <div id="days"></div>
    </main>
    <script type="module" src="/src/whatsnew/page.ts"></script>
  </body>
</html>
